name: AlgoSmart

description: "Media Pembelajaran Interaktif AlgoSmart"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  webview_flutter: ^4.13.0
  image_picker: ^1.1.2
  rxdart: ^0.28.0
  file_picker: ^10.3.2
  flutter:
    sdk: flutter
    

  cupertino_icons: ^1.0.8

  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1

  provider: ^6.1.5+1

  go_router: ^17.2.3

  fluttertoast: ^9.0.0

  flutter_spinkit: ^5.2.2

  lottie: ^3.3.3

  url_launcher: ^6.3.2

  youtube_player_iframe: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true


  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/algosmart.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6366F1"
  adaptive_icon_foreground: "assets/images/algosmart.png"

    